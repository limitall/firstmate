<!DOCTYPE html>
<html lang="en" data-theme="hud">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIRSTMATE // BRIDGE</title>
<style>
  /* ================================================================
     FIRSTMATE BRIDGE - voice-reactive HUD
     Single deliberate visual world: dark ground, cyan instrument light,
     amber for "needs the captain", red for critical. No theme switch -
     a HUD is a HUD.
     ================================================================ */
  :root {
    --void:      #04090C;
    --deep:      #071319;
    --cyan:      #4FD8FF;
    --cyan-dim:  #1C6E8C;
    --cyan-ghost:rgba(79,216,255,.10);
    --amber:     #FFB24A;
    --red:       #FF5A4E;
    --green:     #55E6A5;
    --text:      #BFE9F7;
    --text-dim:  #5C8persistent;
    --text-dim:  #5C8797;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--text);
    font-family: "Bahnschrift", "DIN Condensed", "Segoe UI Variable Display",
                 "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    letter-spacing: .04em;
  }

  /* ambient grid + vignette, painted behind everything */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      linear-gradient(var(--cyan-ghost) 1px, transparent 1px) 0 0 / 100% 46px,
      linear-gradient(90deg, var(--cyan-ghost) 1px, transparent 1px) 0 0 / 46px 100%;
    opacity: .35;
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 78%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.72) 100%);
  }

  .stage { position: relative; z-index: 10; height: 100%; display: grid;
           grid-template-rows: auto 1fr auto; }

  /* ---------------- top rail ---------------- */
  .rail {
    display: flex; align-items: center; gap: 20px;
    padding: 14px 26px;
    border-bottom: 1px solid rgba(79,216,255,.16);
  }
  .mark { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .mark b {
    font-size: 15px; font-weight: 700; letter-spacing: .32em;
    color: var(--cyan); text-transform: uppercase;
  }
  .mark i {
    font-style: normal; font-size: 10px; letter-spacing: .28em;
    color: var(--text-dim); text-transform: uppercase;
  }
  .stat { display: flex; align-items: center; gap: 8px; font-size: 10.5px;
          letter-spacing: .18em; text-transform: uppercase; color: var(--text-dim); }
  .stat b { color: var(--cyan); font-weight: 600; letter-spacing: .1em; }
  .led { width: 6px; height: 6px; border-radius: 50%; background: var(--green);
         box-shadow: 0 0 8px var(--green); }
  .led.amber { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

  /* ---------------- centre: the reactor ---------------- */
  .core { position: relative; display: grid; place-items: center; min-height: 0; }
  canvas#reactor { display: block; }

  /* readout that sits inside the rings */
  .readout {
    position: absolute; inset: 0; display: grid; place-content: center;
    text-align: center; pointer-events: none;
  }
  .readout .state {
    font-size: 10px; letter-spacing: .42em; text-transform: uppercase;
    color: var(--cyan-dim); margin-bottom: 10px;
  }
  .readout .heard {
    font-size: 19px; letter-spacing: .02em; color: var(--text);
    max-width: 30ch; margin: 0 auto; min-height: 1.5em; line-height: 1.4;
  }
  .readout .heard.interim { color: var(--cyan-dim); font-style: italic; }
  .readout .level {
    margin-top: 14px; font-size: 10px; letter-spacing: .3em;
    color: var(--cyan-dim); text-transform: uppercase;
  }

  /* corner brackets, the HUD frame */
  .bracket { position: absolute; width: 46px; height: 46px; border: 1px solid var(--cyan-dim);
             opacity: .5; pointer-events: none; }
  .bracket.tl { top: 22px; left: 22px; border-right: 0; border-bottom: 0; }
  .bracket.tr { top: 22px; right: 22px; border-left: 0; border-bottom: 0; }
  .bracket.bl { bottom: 22px; left: 22px; border-right: 0; border-top: 0; }
  .bracket.br { bottom: 22px; right: 22px; border-left: 0; border-top: 0; }

  /* ---------------- side panels ---------------- */
  .panel {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 292px; max-height: 74%; overflow-y: auto;
    padding: 15px 17px;
    border: 1px solid rgba(79,216,255,.2);
    background: linear-gradient(180deg, rgba(7,19,25,.94), rgba(4,9,12,.9));
    backdrop-filter: blur(2px);
  }
  .panel.left  { left: 26px; }
  .panel.right { right: 26px; }
  .panel::-webkit-scrollbar { width: 3px; }
  .panel::-webkit-scrollbar-thumb { background: var(--cyan-dim); }
  .panel h3 {
    margin: 0 0 13px; font-size: 9.5px; font-weight: 700;
    letter-spacing: .3em; text-transform: uppercase; color: var(--cyan);
    padding-bottom: 8px; border-bottom: 1px solid rgba(79,216,255,.18);
    display: flex; align-items: center; gap: 8px;
  }
  .panel h3 .n {
    margin-left: auto; font-size: 9.5px; color: var(--void);
    background: var(--cyan); padding: 1px 6px; letter-spacing: .1em;
  }
  .panel h3 .n.hot { background: var(--amber); }

  /* task rows */
  .task { margin-bottom: 15px; }
  .task:last-child { margin-bottom: 0; }
  .task .row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
  .task .nm { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .task .pc { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--cyan); }
  .task .pc.none { color: var(--text-dim); font-size: 9.5px; letter-spacing: .16em; }
  .bar { height: 3px; background: rgba(79,216,255,.13); position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--cyan);
           box-shadow: 0 0 9px var(--cyan); }
  .bar.done i { background: var(--cyan-dim); box-shadow: none; }
  /* an unreported percentage is an ABSENCE, never a zero-length bar - the two
     look identical and one of them is a lie */
  .bar.none {
    background: repeating-linear-gradient(-45deg,
      transparent 0 4px, rgba(92,135,151,.5) 4px 8px);
  }
  .task .st { margin: 5px 0 0; font-size: 10.5px; color: var(--text-dim);
              letter-spacing: .02em; line-height: 1.45; }

  /* decisions */
  .dec { padding-bottom: 13px; margin-bottom: 13px;
         border-bottom: 1px solid rgba(79,216,255,.12); }
  .dec:last-child { border: 0; margin-bottom: 0; padding-bottom: 0; }
  .dec .src { font-size: 9px; letter-spacing: .24em; text-transform: uppercase;
              color: var(--amber); }
  .dec .q { margin: 5px 0 9px; font-size: 12.5px; color: var(--text); line-height: 1.45; }
  .dec .opts { display: flex; flex-wrap: wrap; gap: 5px; }
  .dec button {
    font: inherit; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    padding: 5px 9px; cursor: pointer; color: var(--text);
    background: transparent; border: 1px solid var(--cyan-dim);
  }
  .dec button:hover { border-color: var(--cyan); color: var(--cyan); }
  .dec button.rec { border-color: var(--amber); color: var(--amber); }
  .dec button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* ---------------- bottom bar ---------------- */
  .dock {
    display: flex; align-items: center; gap: 16px;
    padding: 15px 26px;
    border-top: 1px solid rgba(79,216,255,.16);
  }
  .talk {
    flex: none; width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: transparent; color: var(--cyan);
    border: 1px solid var(--cyan-dim);
    transition: box-shadow .12s linear, border-color .12s linear;
  }
  .talk svg { width: 19px; height: 19px; }
  .talk.live { border-color: var(--red); color: var(--red);
               box-shadow: 0 0 18px rgba(255,90,78,.5); }
  .talk:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .dock input {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; letter-spacing: .06em;
    padding: 11px 14px; color: var(--text);
    background: rgba(79,216,255,.05);
    border: 1px solid rgba(79,216,255,.2);
  }
  .dock input::placeholder { color: var(--text-dim); letter-spacing: .14em;
                             text-transform: uppercase; font-size: 11px; }
  .dock input:focus-visible { outline: none; border-color: var(--cyan); }
  .hint { font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase;
          color: var(--text-dim); white-space: nowrap; }

  @media (max-width: 1180px) { .panel { display: none; } }
  @media (prefers-reduced-motion: reduce) { .led { box-shadow: none; } }
</style>
</head>
<body>

<div class="stage">

  <!-- ============ TOP RAIL ============ -->
  <div class="rail">
    <div class="mark"><b>Firstmate</b><i>Bridge</i></div>
    <div class="stat"><span class="led" id="led"></span><span>Bridge <b id="bridgeState">Online</b></span></div>
    <div class="stat">Supervising <b id="supCount">1</b></div>
    <div class="stat">Capacity <b id="cap">79%</b></div>
  </div>

  <!-- ============ THE REACTOR ============ -->
  <div class="core">
    <span class="bracket tl"></span><span class="bracket tr"></span>
    <span class="bracket bl"></span><span class="bracket br"></span>

    <canvas id="reactor"></canvas>

    <div class="readout">
      <div class="state" id="stateLabel">Standing by</div>
      <div class="heard" id="heard">Hold the mic, or press and hold Space</div>
      <div class="level" id="levelLabel"></div>
    </div>

    <!-- work under way -->
    <aside class="panel left">
      <h3>Work under way <span class="n" id="taskCount">4</span></h3>
      <div id="tasks"></div>
    </aside>

    <!-- decisions -->
    <aside class="panel right">
      <h3>Waiting on you <span class="n hot" id="decCount">4</span></h3>
      <div id="decisions"></div>
    </aside>
  </div>

  <!-- ============ DOCK ============ -->
  <div class="dock">
    <button class="talk" id="talk" type="button" aria-pressed="false" aria-label="Hold to speak">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>
      </svg>
    </button>
    <input id="typed" type="text" placeholder="Or type a command" aria-label="Command firstmate">
    <span class="hint" id="micHint">Push to talk</span>
  </div>
</div>

<script>
/* ==================================================================
   THE REACTOR - concentric rings driven by live microphone amplitude.
   The captain's requirement is that it reacts to voice LEVEL, so the
   geometry is bound to a smoothed RMS of the input rather than to a
   decorative timer.
   ================================================================== */
const cv  = document.getElementById('reactor');
const ctx = cv.getContext('2d');

let W = 0, H = 0, DPR = 1;
function size() {
  const box = cv.parentElement.getBoundingClientRect();
  const d = Math.min(box.width, box.height) * 0.92;
  DPR = window.devicePixelRatio || 1;
  W = H = Math.max(320, Math.min(d, 640));
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
size();
addEventListener('resize', size);

const CY = '#4FD8FF', DIM = '#1C6E8C', AMB = '#FFB24A';

let level = 0;        // smoothed 0..1 amplitude - the thing that drives everything
let target = 0;
let bins = new Uint8Array(64);
let listening = false;
let t = 0;

function ring(cx, cy, r, from, to, colour, width, glow) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, from, to);
  ctx.strokeStyle = colour;
  ctx.lineWidth = width;
  ctx.shadowBlur = glow;
  ctx.shadowColor = colour;
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function draw() {
  t += 0.016;
  // ease toward the live level; fast attack, slow release reads as natural
  level += (target - level) * (target > level ? 0.35 : 0.06);

  const cx = W / 2, cy = H / 2;
  const base = Math.min(W, H) * 0.5;
  const L = level;

  ctx.clearRect(0, 0, W, H);

  /* --- outer ticked ring: rotates slowly, always present --- */
  const rOuter = base * 0.94;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(t * 0.06);
  for (let i = 0; i < 90; i++) {
    const a = (i / 90) * Math.PI * 2;
    const long = i % 10 === 0;
    const len = long ? 13 : 6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * rOuter, Math.sin(a) * rOuter);
    ctx.lineTo(Math.cos(a) * (rOuter - len), Math.sin(a) * (rOuter - len));
    ctx.strokeStyle = long ? CY : DIM;
    ctx.globalAlpha = long ? 0.75 : 0.4;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  /* --- counter-rotating arc segments, opening with level --- */
  const rSeg = base * 0.84;
  const spread = 0.34 + L * 0.5;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-t * 0.22);
  for (let i = 0; i < 3; i++) {
    const a0 = (i / 3) * Math.PI * 2;
    ring(0, 0, rSeg, a0, a0 + spread, CY, 2 + L * 2, 10 + L * 26);
  }
  ctx.restore();

  /* --- spectrum ring: one spoke per frequency bin, the literal voice --- */
  const rSpec = base * 0.66;
  ctx.save();
  ctx.translate(cx, cy);
  const n = bins.length;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    const v = listening ? bins[i] / 255 : 0;
    const len = 6 + v * base * 0.3;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * rSpec, Math.sin(a) * rSpec);
    ctx.lineTo(Math.cos(a) * (rSpec + len), Math.sin(a) * (rSpec + len));
    ctx.strokeStyle = v > 0.62 ? AMB : CY;
    ctx.globalAlpha = 0.28 + v * 0.72;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  /* --- inner rings --- */
  ring(cx, cy, base * 0.5, 0, Math.PI * 2, DIM, 1, 0);
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(t * 0.5);
  ring(0, 0, base * 0.42, 0, Math.PI * 1.35, CY, 1.5, 8 + L * 18);
  ctx.restore();
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-t * 0.35);
  ring(0, 0, base * 0.34, 0, Math.PI * 0.85, CY, 1.5, 8 + L * 18);
  ctx.restore();

  /* --- the core: breathes with level --- */
  const rCore = base * (0.12 + L * 0.14);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rCore * 2.6);
  g.addColorStop(0,   'rgba(210,246,255,' + (0.95).toFixed(2) + ')');
  g.addColorStop(0.3, 'rgba(79,216,255,'  + (0.55 + L * 0.4).toFixed(2) + ')');
  g.addColorStop(1,   'rgba(79,216,255,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, rCore * 2.6, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, rCore, 0, Math.PI * 2);
  ctx.fillStyle = '#EAFBFF';
  ctx.shadowBlur = 30 + L * 60;
  ctx.shadowColor = CY;
  ctx.fill();
  ctx.shadowBlur = 0;

  requestAnimationFrame(draw);
}
draw();

/* ==================================================================
   MICROPHONE - real level, not a simulation. Permission is requested
   only when the captain first holds the button: push-to-talk, never a
   hot mic sitting open all day.
   ================================================================== */
let audioCtx = null, analyser = null, stream = null, data = null;
const stateLabel = document.getElementById('stateLabel');
const heard      = document.getElementById('heard');
const levelLabel = document.getElementById('levelLabel');
const talk       = document.getElementById('talk');
const micHint    = document.getElementById('micHint');

async function startMic() {
  if (listening) return;
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      stream   = await navigator.mediaDevices.getUserMedia({ audio: true });
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.75;
      src.connect(analyser);
      data = new Uint8Array(analyser.frequencyBinCount);
    }
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    listening = true;
    talk.classList.add('live');
    talk.setAttribute('aria-pressed', 'true');
    stateLabel.textContent = 'Listening';
    heard.textContent = '';
    heard.classList.add('interim');
    micHint.textContent = 'Release to send';
    poll();
    startRecognition();
  } catch (err) {
    stateLabel.textContent = 'Microphone unavailable';
    heard.classList.remove('interim');
    heard.textContent = 'No microphone, or permission was refused. Typing still works.';
  }
}

function stopMic() {
  if (!listening) return;
  listening = false;
  target = 0;
  talk.classList.remove('live');
  talk.setAttribute('aria-pressed', 'false');
  stateLabel.textContent = 'Standing by';
  levelLabel.textContent = '';
  micHint.textContent = 'Push to talk';
  bins.fill(0);
  stopRecognition();
}

function poll() {
  if (!listening) return;
  analyser.getByteFrequencyData(data);
  // down-sample into the 64 spokes the ring draws
  const step = Math.floor(data.length / bins.length) || 1;
  let sum = 0;
  for (let i = 0; i < bins.length; i++) {
    bins[i] = data[i * step];
    sum += bins[i];
  }
  const avg = sum / bins.length / 255;
  target = Math.min(1, avg * 2.6);
  levelLabel.textContent = 'Level ' + String(Math.round(target * 100)).padStart(3, '0');
  requestAnimationFrame(poll);
}

/* ---- speech recognition, when the browser has it ---- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function startRecognition() {
  if (!SR) return;
  rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = 'en-US';
  rec.onresult = e => {
    let txt = '';
    for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
    heard.textContent = txt;
    heard.classList.toggle('interim', !e.results[e.results.length - 1].isFinal);
  };
  rec.onerror = () => {};
  try { rec.start(); } catch (_) {}
}
function stopRecognition() {
  if (!rec) return;
  try { rec.stop(); } catch (_) {}
  const said = heard.textContent.trim();
  heard.classList.remove('interim');
  if (said) { stateLabel.textContent = 'Heard'; reply(said); }
  else heard.textContent = 'Hold the mic, or press and hold Space';
  rec = null;
}

/* ---- speaking back ---- */
function speak(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.02; u.pitch = 0.95;
  const v = speechSynthesis.getVoices().find(x => /George|Hazel|Susan/i.test(x.name));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function reply(said) {
  const answer = 'Aye captain. ' + said.replace(/[.?!]+$/, '') + ' — understood.';
  setTimeout(() => {
    stateLabel.textContent = 'Speaking';
    heard.textContent = answer;
    speak(answer);
    setTimeout(() => { stateLabel.textContent = 'Standing by'; }, 2600);
  }, 320);
}

/* ---- controls: press and hold, mouse / touch / space ---- */
talk.addEventListener('mousedown', startMic);
talk.addEventListener('touchstart', e => { e.preventDefault(); startMic(); }, {passive:false});
['mouseup','mouseleave','touchend'].forEach(ev => talk.addEventListener(ev, stopMic));
addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat && document.activeElement.id !== 'typed') {
    e.preventDefault(); startMic();
  }
});
addEventListener('keyup', e => { if (e.code === 'Space') stopMic(); });

document.getElementById('typed').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) {
    heard.textContent = e.target.value.trim();
    reply(e.target.value.trim());
    e.target.value = '';
  }
});

/* ==================================================================
   FLEET STATE - shape matches what bin/fm-progress.ps1 already emits,
   so the live bridge can drop real records in unchanged.
   ================================================================== */
const TASKS = [
  { name: 'Voice channel',      pct: 100, state: 'done',    note: 'Ready to land.' },
  { name: 'Browser front end',  pct: 100, state: 'done',    note: 'Design settled.' },
  { name: 'Telegram bridge',    pct: 100, state: 'done',    note: 'Design settled.' },
  { name: 'Suite rebuild',      pct: null, state: 'working', note: 'Running. Has not reported how far along.' }
];

const DECISIONS = [
  { src: 'Telegram', q: 'Create a Telegram bot?',
    opts: [{ t: 'Create it' }, { t: 'Not now' }] },
  { src: 'Telegram', q: 'What may a message from your phone do?',
    opts: [{ t: 'Dispatch, not merge', rec: true }, { t: 'Ask for a code' }, { t: 'Anything' }] },
  { src: 'Browser',  q: 'How far should this reach?',
    opts: [{ t: 'This laptop' }, { t: 'Your Wi-Fi', rec: true }, { t: 'Anywhere' }] },
  { src: 'Voice',    q: 'May speech approve a merge?',
    opts: [{ t: 'Type those', rec: true }, { t: 'Speech is enough' }] }
];

const tasksEl = document.getElementById('tasks');
TASKS.forEach(k => {
  const known = k.pct !== null;
  const el = document.createElement('div');
  el.className = 'task';
  el.innerHTML =
    '<div class="row"><span class="nm">' + k.name + '</span>' +
    '<span class="pc' + (known ? '' : ' none') + '">' +
      (known ? k.pct + '%' : 'not said') + '</span></div>' +
    '<div class="bar' + (known ? (k.pct === 100 ? ' done' : '') : ' none') + '">' +
      (known ? '<i style="width:' + k.pct + '%"></i>' : '') + '</div>' +
    '<p class="st">' + k.note + '</p>';
  tasksEl.appendChild(el);
});
document.getElementById('taskCount').textContent = TASKS.length;

const decEl = document.getElementById('decisions');
function renderDecisions() {
  decEl.innerHTML = '';
  DECISIONS.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'dec';
    el.innerHTML =
      '<div class="src">' + d.src + '</div><p class="q">' + d.q + '</p>' +
      '<div class="opts">' + d.opts.map(o =>
        '<button type="button" class="' + (o.rec ? 'rec' : '') + '">' + o.t + '</button>').join('') +
      '</div>';
    el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      DECISIONS.splice(i, 1);
      renderDecisions();
      const n = document.getElementById('decCount');
      n.textContent = DECISIONS.length;
      if (!DECISIONS.length) { n.classList.remove('hot'); decEl.innerHTML =
        '<p class="st" style="color:var(--text-dim)">Nothing waiting on you.</p>'; }
      const line = 'Noted, captain. ' + b.textContent + '.';
      heard.textContent = line; speak(line);
    }));
    decEl.appendChild(el);
  });
}
renderDecisions();
document.getElementById('decCount').textContent = DECISIONS.length;
</script>
</body>
</html>
